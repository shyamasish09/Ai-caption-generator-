<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Caption Generator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-card-image me-2"></i>AI Caption Generator
      </a>
      <button id="darkModeBtn" class="toggle-switch light">
        <i class="bi bi-moon-fill"></i> <span>Dark Mode</span>
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main class="container my-5">
    <div class="row g-4">
      <!-- Upload Area -->
      <div class="col-lg-6">
        <div id="drop-area" class="border border-2 border-dashed rounded-3 p-5 text-center bg-white shadow-sm">
          <i class="bi bi-cloud-upload fs-1 text-primary mb-3"></i>
          <p class="mt-3">Drag & Drop an image or <span class="text-primary fw-bold">click here</span></p>
          <input type="file" id="fileElem" accept="image/*" hidden>
          <button class="btn btn-outline-primary mt-3" id="fileSelect">
            <i class="bi bi-folder2-open me-2"></i>Choose File
          </button>
          <button class="btn btn-outline-secondary mt-3" id="demoBtn">
            <i class="bi bi-eye me-2"></i> Demo Mode
          </button>
          <div id="preview" class="mt-4 w-100 text-center">
            <img id="previewImage" src="" alt="Image preview" class="d-none img-fluid">
          </div>
        </div>
      </div>

      <!-- Result Area -->
      <div class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">
              <i class="bi bi-chat-square-text me-2"></i>Generated Caption
            </h5>
            <div class="bg-light rounded p-3 mb-3 flex-grow-1">
              <p id="captionOutput" class="text-muted fst-italic mb-0">No caption yet. Upload an image or try Demo.</p>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button id="generateBtn" class="btn btn-success flex-grow-1" disabled>
                <i class="bi bi-magic me-2"></i> Generate Caption
              </button>
              <button id="removeBtn" class="btn btn-danger" disabled>
                <i class="bi bi-trash"></i>
              </button>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button id="copyBtn" class="btn btn-outline-primary btn-sm flex-grow-1" disabled>
                <i class="bi bi-clipboard me-2"></i> Copy
              </button>
              <button id="downloadBtn" class="btn btn-outline-secondary btn-sm flex-grow-1" disabled>
                <i class="bi bi-download me-2"></i> Download
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- History -->
    <div class="mt-5">
      <h4><i class="bi bi-clock-history me-2"></i>History</h4>
      <div id="history" class="row g-3">
        <div class="col-12">
          <p class="text-muted">No history yet. Generate captions to see them here.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-5 py-3 bg-light text-center">
    <div class="container">
<p class="mb-0 text-muted">Al Image Caption Generator &copy; 2023</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="main.js"></script>
</body>
</html>
